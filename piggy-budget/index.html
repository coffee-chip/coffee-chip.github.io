<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#a54e68">
  <meta name="description" content="A flexible budget for discretionary spending.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css?v=26">
  <script src="./app.js?v=26" type="module"></script>
  <title>Piggy Budget</title>
</head>
<body>
  <div class="app-shell">
    <header class="site-header">
      <div class="header-title-group"><a class="brand-icon-link" href="./?v=26" aria-label="Home"><img class="brand-icon" src="./icons/icon.svg" alt=""></a><h1 class="header-page-title">Categories &amp; goals</h1></div>
      <nav aria-label="Main navigation"><a href="./?v=26" aria-current="page">Home</a><a class="nav-icon" href="./settings.html?v=26" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.09a2 2 0 0 1 1 1.74v.5a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/></svg></a></nav>
    </header>
    <main>
      <section aria-label="Categories and goals">
        <div id="category-list" class="category-list"></div>
        <div class="home-actions">
          <button type="button" id="transfer-toggle" class="secondary-button" aria-expanded="false" aria-controls="transfer-panel">Transfer budget money</button>
        </div>
        <section class="panel transfer-panel" id="transfer-panel" aria-labelledby="transfer-title" hidden>
          <h2 id="transfer-title">Transfer budget money</h2>
          <form id="transfer-form">
            <div class="form-grid">
              <label>From<select name="fromBucketId" required></select></label>
              <label>To<select name="toBucketId" required></select></label>
              <label>Amount ($)<input name="amount" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="0.00" required></label>
              <label>Description (optional)<input name="note" maxlength="100" placeholder="Move budget"></label>
            </div>
            <button type="submit">Transfer</button><p id="transfer-message" class="form-message" role="status"></p>
          </form>
        </section>
        <a class="manage-categories-link" href="./manage-categories.html?v=26">Manage categories →</a>
      </section>
    </main>
  </div>
</body>
</html>
