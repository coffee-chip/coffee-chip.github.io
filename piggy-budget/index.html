<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#a54e68">
  <meta name="description" content="A flexible budget for discretionary spending.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css?v=17">
  <script src="./app.js?v=17" type="module"></script>
  <title>Piggy Budget</title>
</head>
<body>
  <div class="app-shell">
    <header class="site-header">
      <a class="brand" href="./?v=17" aria-label="Piggy Budget home"><span class="brand-mark" aria-hidden="true">●</span> Piggy Budget</a>
      <nav aria-label="Main navigation"><a href="./?v=17" aria-current="page">Home</a><a href="./settings.html?v=17">Settings</a></nav>
    </header>
    <main>
      <section class="page-heading compact-heading"><h1>Your categories</h1></section>
      <section aria-label="Category balances">
        <div id="category-list" class="category-list"></div>
        <div class="home-actions">
          <a class="add-category-link" href="./settings.html?v=17#add-category">+ Add category</a>
          <button type="button" id="transfer-toggle" class="text-button" aria-expanded="false" aria-controls="transfer-panel">Transfer between categories</button>
        </div>
        <section class="panel transfer-panel" id="transfer-panel" aria-labelledby="transfer-title" hidden>
          <h2 id="transfer-title">Transfer between categories</h2>
          <form id="transfer-form">
            <div class="form-grid">
              <label>From<select name="fromCategoryId" required></select></label>
              <label>To<select name="toCategoryId" required></select></label>
              <label>Amount ($)<input name="amount" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="0.00" required></label>
              <label>Description (optional)<input name="note" maxlength="100" placeholder="Move budget"></label>
            </div>
            <button type="submit">Transfer</button><p id="transfer-message" class="form-message" role="status"></p>
          </form>
        </section>
      </section>
    </main>
  </div>
</body>
</html>
