<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#a54e68">
  <meta name="description" content="Manage Piggy Budget preferences, backup, and developer tools.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <script src="./theme.js"></script>
  <link rel="stylesheet" href="./styles.css">
  <script src="./settings.js" type="module"></script>
  <title>Settings · Piggy Budget</title>
</head>
<body>
  <div class="app-shell">
    <header class="site-header">
      <div class="header-title-group"><a class="brand-icon-link" href="./" aria-label="Home"><img class="brand-icon" src="./icons/icon.svg" alt=""></a><h1 class="header-page-title">Settings</h1></div>
      <nav aria-label="Main navigation"><a href="./">Home</a><a class="nav-icon" href="./settings.html" aria-label="Settings" title="Settings" aria-current="page"><span class="settings-icon" aria-hidden="true"></span></a></nav>
    </header>
    <main>
      <section class="panel panel--narrow" aria-labelledby="appearance-title">
        <h2 id="appearance-title">Appearance</h2>
        <div class="form-grid">
          <label>Color theme
            <select id="color-theme">
              <option value="garnet">Garnet</option>
              <option value="amber">Amber</option>
              <option value="lapis">Lapis</option>
            </select>
          </label>
          <label>Mode
            <select id="appearance-mode">
              <option value="light">Light</option>
              <option value="dark">Dark</option>
              <option value="system">System</option>
            </select>
          </label>
        </div>
      </section>
      <section class="panel panel--narrow" aria-labelledby="interval-title">
        <h2 id="interval-title">Budget interval</h2>
        <label>Interval
          <select id="budget-interval">
            <option value="2-weeks">2 weeks</option>
            <option value="4-weeks">4 weeks</option>
            <option value="30-days">30 days</option>
            <option value="1-month">1 month</option>
          </select>
        </label>
      </section>
      <section class="panel panel--narrow"><h2>Backup &amp; restore</h2><div class="action-group"><button type="button" id="download-backup" class="button button--primary">Download backup</button><label class="button-link button--secondary file-button">Restore backup<input id="restore-backup" type="file" accept="application/json,.json" hidden></label></div><p id="backup-message" class="form-message" role="status"></p></section>
      <section class="panel panel--narrow"><h2>Developer tools</h2><p id="simulation-status" class="muted"></p><button type="button" id="advance-day" class="button button--primary">Advance day</button><p id="advance-message" class="form-message" role="status"></p></section>
    </main>
  </div>
</body>
</html>
