<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#a54e68">
  <meta name="description" content="Manage Piggy Budget preferences, backup, and developer tools.">

  <title>Settings · Piggy Budget</title>
</head>
<body>
  <div class="app-shell">
    <header class="site-header">
      <div class="header-title-group"><a class="brand-icon-link" href="./?v=29" aria-label="Home"><img class="brand-icon" src="./icons/icon.svg" alt=""></a><h1 class="header-page-title">Settings</h1></div>
      <nav aria-label="Main navigation"><a href="./?v=29">Home</a><a class="nav-icon" href="./settings.html?v=29" aria-label="Settings" title="Settings" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.09a2 2 0 0 1 1 1.74v.5a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/></svg></a></nav>
    </header>
    <main class="compact-main">
      <section class="panel interval-setting" aria-labelledby="interval-title">
        <h2 id="interval-title">Budget interval</h2>
        <label>Interval
          <select id="budget-interval">
            <option value="2-weeks">2 weeks</option>
            <option value="4-weeks">4 weeks</option>
            <option value="30-days">30 days</option>
            <option value="1-month">1 month</option>
          </select>
        </label>
      </section>
      <section class="panel data-tools"><h2>Backup &amp; restore</h2><div class="data-actions"><button type="button" id="download-backup">Download backup</button><label class="button-link secondary-button file-button">Restore backup<input id="restore-backup" type="file" accept="application/json,.json" hidden></label></div><p id="backup-message" class="form-message" role="status"></p></section>
      <section class="panel developer-tools"><h2>Developer tools</h2><p id="simulation-status" class="muted"></p><button type="button" id="advance-day">Advance day</button><p id="advance-message" class="form-message" role="status"></p></section>
    </main>
  </div>
</body>
</html>
