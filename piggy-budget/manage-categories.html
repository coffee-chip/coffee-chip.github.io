<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#a54e68">
  <meta name="description" content="Manage Piggy Budget groups and categories.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css?v=32">
  <script src="./app.js?v=32" type="module"></script>
  <title>Manage categories · Piggy Budget</title>
</head>
<body>
  <div class="app-shell">
    <header class="site-header">
      <div class="header-title-group"><a class="brand-icon-link" href="./?v=32" aria-label="Home"><img class="brand-icon" src="./icons/icon.svg" alt=""></a><h1 class="header-page-title">Manage</h1></div>
      <nav aria-label="Main navigation">
        <a href="./?v=32">Home</a>
        <a class="nav-icon" href="./settings.html?v=32" aria-label="Settings" title="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.09a2 2 0 0 1 1 1.74v.5a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        </a>
      </nav>
    </header>
    <main class="compact-main">
      <section class="settings-list-section manage-list-section">
        <ul id="settings-categories" class="settings-list"></ul>
        <button type="button" id="add-group" class="add-category-button">+ Add group</button>
        <button type="button" id="add-category" class="add-category-button">+ Add category</button>
        <button type="button" id="add-goal" class="add-category-button">+ Add goal</button>
        <p id="category-status" class="form-message" role="status"></p>
      </section>
      <section class="panel add-category-panel" id="add-group-panel" hidden>
        <h2>Add group</h2>
        <form id="group-form">
          <div class="form-grid">
            <label>Name<input name="name" maxlength="40" placeholder="Hobbies" required></label>
            <label>Total allocation per interval ($)<input name="total" type="number" min="0" step="0.01" placeholder="100.00" required></label>
          </div>
          <button type="submit">Save group</button>
          <p id="group-message" class="form-message" role="status"></p>
        </form>
      </section>
      <section class="panel add-category-panel" id="add-category-panel" hidden>
        <h2>Add category</h2>
        <form id="category-form">
          <div class="name-icon-row">
            <label>Name<input name="name" maxlength="40" placeholder="Clothes, games, crafts…" required></label>
            <label>Emoji icon<input name="icon" type="text" maxlength="64" value="🐷" required></label>
          </div>
          <div class="form-grid">
            <label>Group<select name="groupId" required></select></label>
            <label>Allocation per interval ($)<input name="allocation" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="50.00" required></label>
            <label>Starting funds<select name="startingMultiplier"></select></label>
          </div>
          <p id="new-category-preview" class="allocation-preview" role="status"></p>
          <button type="submit">Save category</button>
          <p id="category-message" class="form-message" role="status"></p>
        </form>
      </section>
      <section class="panel add-category-panel" id="add-goal-panel" hidden>
        <h2>Add goal</h2>
        <form id="goal-form">
          <div class="name-icon-row">
            <label>Name<input name="name" maxlength="40" placeholder="Vacation, new laptop…" required></label>
            <label>Emoji icon<input name="icon" type="text" maxlength="64" value="🎯" required></label>
          </div>
          <div class="form-grid">
            <label>Group<select name="groupId" required></select></label>
            <label>Target amount ($)<input name="target" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="500.00" required></label>
          </div>
          <button type="submit">Save goal</button>
          <p id="goal-message" class="form-message" role="status"></p>
        </form>
      </section>
    </main>
  </div>
</body>
</html>
