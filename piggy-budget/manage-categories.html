<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#a54e68">
  <meta name="description" content="Manage Piggy Budget groups and categories.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <script src="./manage.js" type="module"></script>
  <title>Manage categories · Piggy Budget</title>
</head>
<body>
  <div class="app-shell">
    <header class="site-header">
      <div class="header-title-group"><a class="brand-icon-link" href="./" aria-label="Home"><img class="brand-icon" src="./icons/icon.svg" alt=""></a><h1 class="header-page-title">Manage</h1></div>
      <nav aria-label="Main navigation">
        <a href="./">Home</a>
        <a class="nav-icon" href="./settings.html" aria-label="Settings" title="Settings"><span class="settings-icon" aria-hidden="true"></span></a>
      </nav>
    </header>
    <main>
      <section>
        <ul id="settings-categories" class="collection-list"></ul>
        <div class="action-group create-actions">
          <button type="button" id="add-group" class="button button--primary">+ Add group</button>
          <button type="button" id="add-category" class="button button--primary">+ Add category</button>
          <button type="button" id="add-goal" class="button button--primary">+ Add goal</button>
        </div>
        <p id="category-status" class="form-message" role="status"></p>
      </section>
      <section class="panel panel--narrow" id="add-group-panel" hidden>
        <h2>Add group</h2>
        <form id="group-form">
          <div class="form-grid">
            <label>Name<input name="name" maxlength="40" placeholder="Hobbies" required></label>
            <label>Total allocation per interval ($)<input name="total" type="number" min="0" step="0.01" placeholder="100.00" required></label>
          </div>
          <div class="form-actions"><button type="submit" class="button button--primary">Save group</button><button type="button" id="group-cancel" class="button button--transparent">Cancel</button></div>
          <p id="group-message" class="form-message" role="status"></p>
        </form>
      </section>
      <section class="panel panel--narrow" id="add-category-panel" hidden>
        <h2>Add category</h2>
        <form id="category-form">
          <div class="name-icon-row">
            <label>Name<input name="name" maxlength="40" placeholder="Clothes, games, crafts…" required></label>
            <label>Emoji icon<input name="icon" type="text" maxlength="64" value="🐷" required></label>
          </div>
          <div class="form-grid">
            <label>Group<select name="groupId" required></select></label>
            <label>Allocation per interval ($)<input name="allocation" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="50.00" required></label>
            <label>Starting funds<select name="startingMultiplier"></select></label>
          </div>
          <p id="new-category-preview" class="allocation-preview" role="status"></p>
          <div class="form-actions"><button type="submit" class="button button--primary">Save category</button><button type="button" id="category-cancel" class="button button--transparent">Cancel</button></div>
          <p id="category-message" class="form-message" role="status"></p>
        </form>
      </section>
      <section class="panel panel--narrow" id="add-goal-panel" hidden>
        <h2>Add goal</h2>
        <form id="goal-form">
          <div class="name-icon-row">
            <label>Name<input name="name" maxlength="40" placeholder="Vacation, new laptop…" required></label>
            <label>Emoji icon<input name="icon" type="text" maxlength="64" value="🎯" required></label>
          </div>
          <div class="form-grid">
            <label>Group<select name="groupId" required></select></label>
            <label>Target amount ($)<input name="target" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="500.00" required></label>
          </div>
          <div class="form-actions"><button type="submit" class="button button--primary">Save goal</button><button type="button" id="goal-cancel" class="button button--transparent">Cancel</button></div>
          <p id="goal-message" class="form-message" role="status"></p>
        </form>
      </section>
    </main>
  </div>
</body>
</html>
