<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7f8">
  <script>
    (() => {
      try {
        const saved = JSON.parse(localStorage.getItem('pokemon-type-trainer') || 'null');
        const preference = ['system', 'light', 'dark'].includes(saved?.settings?.theme)
          ? saved.settings.theme
          : 'system';
        const resolved = preference === 'system'
          ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : preference;
        document.documentElement.dataset.themePreference = preference;
        document.documentElement.dataset.theme = resolved;
      } catch {
        document.documentElement.dataset.themePreference = 'system';
        document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
    })();
  </script>
  <title>Pokémon Type Trainer</title>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <h1>Pokémon Type Trainer</h1>
      <div class="muted">Architecture prototype</div>
    </header>

    <main id="app-view" aria-live="polite"></main>

    <nav class="app-nav" aria-label="Primary navigation">
      <a href="#quiz" data-route="quiz">Quiz</a>
      <a href="#study" data-route="study">Study</a>
      <a href="#progress" data-route="progress">Progress</a>
      <a href="#settings" data-route="settings">Settings</a>
    </nav>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
