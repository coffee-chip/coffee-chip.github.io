<!doctype html>
<html lang="en" data-palette="classic" data-appearance="light" data-appearance-preference="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f8">
  <meta name="application-name" content="Pokémon Type Trainer">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Type Trainer">
  <script>
    (() => {
      try {
        const saved = JSON.parse(localStorage.getItem('pokemon-type-trainer') || 'null');
        const paletteTheme = saved?.settings?.paletteTheme || 'classic';
        const appearance = saved?.settings?.appearance || 'system';
        const resolved = appearance === 'system'
          ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : appearance;
        document.documentElement.dataset.palette = paletteTheme;
        document.documentElement.dataset.appearancePreference = appearance;
        document.documentElement.dataset.appearance = resolved;
      } catch {
        document.documentElement.dataset.palette = 'classic';
        document.documentElement.dataset.appearancePreference = 'system';
        document.documentElement.dataset.appearance = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
    })();
  </script>
  <title>Pokémon Type Trainer</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/app-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/app-icon.svg">
  <link rel="stylesheet" href="./css/color-tokens.css">
  <link rel="stylesheet" href="./css/styles.css">
  <link rel="stylesheet" href="./css/page-header.css">
  <link rel="stylesheet" href="./css/service-worker.css">
  <link rel="stylesheet" href="./css/developer-overlay.css">
  <link rel="stylesheet" href="./css/progress.css">
  <link rel="stylesheet" href="./css/mnemonics.css">
  <link rel="stylesheet" href="./css/pokemon-lookup.css">
  <link rel="stylesheet" href="./css/study-navigation.css">
  <link rel="stylesheet" href="./css/quiz-pokemon.css">
  <script src="./js/errorOverlayBootstrap.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="page-header" aria-label="Page header">
      <h1 class="page-header-title" id="page-title"></h1>
      <div class="page-header-actions">
        <a href="#settings" data-route="settings" class="settings-gear" aria-label="Settings" title="Settings">⚙</a>
      </div>
    </header>
    <main id="app-view" aria-live="polite" aria-labelledby="page-title"></main>
    <nav class="app-nav" aria-label="Primary navigation">
      <a href="#quiz" data-route="quiz">Quiz</a>
      <a href="#study" data-route="study">Study</a>
      <a href="#progress" data-route="progress">Progress</a>
    </nav>
  </div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
